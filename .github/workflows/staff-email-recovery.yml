name: Activate staff email recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/staff-email-recovery.yml'
      - 'scripts/configure-staff-email-recovery.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: holdings-staff-infrastructure
  cancel-in-progress: false
jobs:
  email-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify staff accounts and recovery security
        run: node --test tests/staff-auth.test.mjs
      - name: Activate separate email verification for password recovery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/configure-staff-email-recovery.mjs
